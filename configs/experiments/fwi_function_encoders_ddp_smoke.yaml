experiment: fwi_function_encoders_ddp_smoke
description: Small real-data FWI smoke test for two-GPU function encoder DDP.

dataset:
  name: fwi
  source: ajthor/fwi
  sample_limit: 8

runtime:
  dry_run: true
  launcher: torchrun
  nproc_per_node: 2
  device: cuda
  num_workers: 0
  pin_memory: true

matrix:
  seeds: [1]
  stages:
    - function_encoders

function_encoders:
  artifact: ddp_smoke
  encoder_types: [input, output]
  basis:
    kind: siren
    n_basis: 4
    hidden_sizes: [16]
    omega_0: 30.0
  regularization: 0.001
  batch_size: 2
  epochs: 1
  learning_rate: 0.0001
  checkpoint_interval: 1
