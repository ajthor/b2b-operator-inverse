experiment: fwi_function_encoders
description: FWI function encoder training plan for the repository overhaul.

dataset:
  name: fwi
  source: ajthor/fwi
  sample_limit: null

runtime:
  dry_run: true
  launcher: torchrun
  nproc_per_node: 1
  device: cuda
  num_workers: 4
  pin_memory: true

matrix:
  seeds: [1]
  stages:
    - function_encoders

function_encoders:
  artifact: default
  encoder_types: [input, output]
  basis:
    kind: siren
    n_basis: 100
    hidden_sizes: [512, 512, 512]
    omega_0: 30.0
  regularization: 0.001
  batch_size: 4
  epochs: 1
  learning_rate: 0.0001
  checkpoint_interval: 1
