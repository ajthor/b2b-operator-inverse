experiment: burgers_deterministic_comparison
description: Matched Burgers comparison of B2B nonlinear, deterministic DeepONet, and FNO.

dataset:
  name: burgers_1d
  source: ajthor/burgers-fenics
  sample_limit: 256

runtime:
  dry_run: true
  launcher: torchrun
  nproc_per_node: 1
  device: cuda
  num_workers: 0
  pin_memory: true
  env:
    CUDA_VISIBLE_DEVICES: "0"
    MASTER_PORT: "29610"

matrix:
  seeds: [17]
  stages: [function_encoders, inverse_models, baselines, evaluation]

function_encoders:
  artifact: deterministic_comparison_nbasis32
  encoder_types: [input, output]
  coefficient_grad: false
  regularization: 0.001
  basis:
    kind: mlp
    activation: relu
    n_basis: 32
    hidden_sizes: [128, 128]
  batch_size: 16
  sample_with_replacement: true
  max_steps: 500
  eval_interval: 100
  eval_batches: null
  log_interval: 25
  learning_rate: 0.001
  checkpoint_interval: 100

inverse_models:
  models: [nonlinear]
  artifact: nonlinear_deterministic_comparison
  function_encoder_artifact: deterministic_comparison_nbasis32
  forward_model: null
  hidden_sizes: [128, 128]
  prediction_loss_weight: 1.0
  coefficient_loss_weight: 0.0
  batch_size: 16
  sample_with_replacement: true
  max_steps: 500
  eval_interval: 100
  eval_batches: null
  log_interval: 25
  learning_rate: 0.001
  checkpoint_interval: 100

baselines:
  models: [deeponet, fno]
  batch_size: 16
  sample_with_replacement: true
  max_steps: 500
  eval_interval: 100
  eval_batches: null
  log_interval: 25
  learning_rate: 0.001
  checkpoint_interval: 100
  deeponet:
    branch_hidden_sizes: [128, 128]
    trunk_hidden_sizes: [128, 128]
    n_basis: 64
    loss: relative_l2
  fno:
    lifting_channels: 32
    modes: 16
    n_fourier_layers: 4
    projection_channels: 64
    loss: relative_l2
