experiment: fwi_function_encoders_ramp_4gpu
description: Modest real-data FWI input-encoder ramp for four-GPU timing.

dataset:
  name: fwi
  source: ajthor/fwi
  sample_limit: 32

runtime:
  dry_run: true
  launcher: torchrun
  nproc_per_node: 4
  device: cuda
  num_workers: 0
  pin_memory: true
  env:
    NCCL_SHM_DISABLE: "1"

matrix:
  seeds: [1]
  stages:
    - function_encoders

function_encoders:
  artifact: ramp_4gpu
  encoder_types: [input, output]
  basis_chunk_size: 4
  coefficient_grad: false
  basis:
    kind: siren
    n_basis: 16
    hidden_sizes: [64]
    omega_0: 30.0
  regularization: 0.001
  batch_size: 2
  epochs: 2
  learning_rate: 0.0001
  checkpoint_interval: 1
