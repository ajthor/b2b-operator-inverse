experiment: fwi_function_encoders_ramp_2gpu
description: Modest real-data FWI input-encoder ramp for two-GPU timing.

dataset:
  name: fwi
  source: ajthor/fwi
  sample_limit: 32

runtime:
  dry_run: true
  launcher: torchrun
  nproc_per_node: 2
  device: cuda
  num_workers: 0
  pin_memory: true

matrix:
  seeds: [1]
  stages:
    - function_encoders

function_encoders:
  artifact: ramp_2gpu
  encoder_types: [input, output]
  basis_chunk_size: 4
  basis:
    kind: siren
    n_basis: 16
    hidden_sizes: [64]
    omega_0: 30.0
  regularization: 0.001
  batch_size: 2
  epochs: 2
  learning_rate: 0.0001
  checkpoint_interval: 1
