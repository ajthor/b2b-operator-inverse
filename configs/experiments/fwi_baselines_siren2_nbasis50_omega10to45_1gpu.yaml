experiment: fwi_baselines_siren2_nbasis50_omega10to45_1gpu
description: FWI reviewer baseline matrix queued after the SIREN2 omega 10 to 45 inverse sweep.

dataset:
  name: fwi
  source: ajthor/fwi
  sample_limit: null

runtime:
  dry_run: true
  launcher: torchrun
  nproc_per_node: 1
  device: cuda
  num_workers: 0
  pin_memory: true
  tensorboard_dir: ./results
  env:
    CUDA_VISIBLE_DEVICES: "0"
    MASTER_PORT: "29526"
    NCCL_SHM_DISABLE: "1"

matrix:
  seeds: [1]
  stages:
    - baselines

baselines:
  models:
    - ifno
    - invertible_deeponet
    - nio
  batch_size: 1
  gradient_accumulation_steps: 4
  sample_with_replacement: true
  epochs: 1
  max_steps: 5000
  eval_interval: 250
  eval_batches: 2
  log_interval: 10
  learning_rate: 0.0001
  checkpoint_interval: 250
  ifno:
    modes: 16
    width: 64
    n_layers: 3
    beta: 2.0
    padding: 20
    vae_latent_dim: 24
    intermediate_dim: 64
    epochs_vae: 0
    epochs_ifno: 0
    lr_vae: 0.0001
    lr_ifno: 0.005
    lr_forward: 0.0001
  invertible_deeponet:
    hidden_sizes: [128, 128]
    trunk_hidden_sizes: [128, 128]
    n_coupling_layers: 6
    regularization: 0.001
    forward_loss_weight: 1.0
    inverse_loss_weight: 1.0
    loss: relative_l2
  nio:
    branch_hidden_sizes: [128, 128]
    trunk_hidden_sizes: [128, 128]
    n_basis: 64
    lifting_channels: 32
    modes: 16
    n_fourier_layers: 3
    measurement_points: 64
    loss: l1
