experiment: fwi_forward_models_ddp_smoke
description: Small real-data FWI smoke test for two-GPU forward model DDP.

dataset:
  name: fwi
  source: ajthor/fwi
  sample_limit: 8

runtime:
  dry_run: true
  launcher: torchrun
  nproc_per_node: 2
  device: cuda
  num_workers: 0
  pin_memory: true

matrix:
  seeds: [1]
  stages:
    - forward_models

function_encoders:
  artifact: ddp_smoke
  encoder_types: [input, output]
  basis:
    kind: siren
    n_basis: 4
    hidden_sizes: [16]
    omega_0: 30.0
  regularization: 0.001
  batch_size: 2
  epochs: 1
  learning_rate: 0.0001
  checkpoint_interval: 1

forward_models:
  models: [b2b_nonlinear]
  function_encoder_artifact: ddp_smoke
  hidden_sizes: [16]
  coefficient_loss_weight: 1.0
  reconstruction_loss_weight: 1.0
  batch_size: 2
  epochs: 1
  learning_rate: 0.0001
  checkpoint_interval: 1
