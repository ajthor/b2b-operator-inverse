experiment: burgers_pipeline_smoke
description: Fast Burgers smoke covering reusable function encoders, forward model, inverse model, and evaluation.

dataset:
  name: burgers_1d
  source: ajthor/burgers-fenics
  sample_limit: 8

runtime:
  dry_run: true
  launcher: torchrun
  nproc_per_node: 1
  device: cuda
  num_workers: 0
  pin_memory: true

matrix:
  seeds: [1]
  stages:
    - function_encoders
    - forward_models
    - inverse_models
    - evaluation

function_encoders:
  artifact: pipeline_smoke
  encoder_types: [input, output]
  basis:
    kind: siren
    n_basis: 4
    hidden_sizes: [16]
    omega_0: 30.0
  regularization: 0.001
  batch_size: 2
  epochs: 1
  learning_rate: 0.0001
  checkpoint_interval: 1

forward_models:
  models: [b2b_nonlinear]
  function_encoder_artifact: pipeline_smoke
  hidden_sizes: [16]
  coefficient_loss_weight: 1.0
  reconstruction_loss_weight: 1.0
  batch_size: 2
  epochs: 1
  learning_rate: 0.0001
  checkpoint_interval: 1

inverse_models:
  models: [nonlinear]
  function_encoder_artifact: pipeline_smoke
  forward_model: b2b_nonlinear
  hidden_sizes: [16]
  prediction_loss_weight: 1.0
  coefficient_loss_weight: 0.0
  batch_size: 2
  epochs: 1
  learning_rate: 0.0001
  checkpoint_interval: 1
