experiment: fwi_forward_models_siren2_nbasis100_3gpu
description: Full FWI forward coefficient model training using the SIREN2/WINNER 100-basis omega-curriculum function encoders.

dataset:
  name: fwi
  source: ajthor/fwi
  sample_limit: null

runtime:
  dry_run: true
  launcher: torchrun
  nproc_per_node: 3
  device: cuda
  num_workers: 0
  pin_memory: true
  tensorboard_dir: ./results
  env:
    CUDA_VISIBLE_DEVICES: "0,1,2"
    MASTER_PORT: "29520"
    NCCL_SHM_DISABLE: "1"

matrix:
  seeds: [1]
  stages:
    - forward_models

function_encoders:
  artifact: siren2_nbasis100_omega10to30_ssim_3gpu
  basis_chunk_size: 4
  coefficient_grad: false
  basis:
    kind: siren_square
    n_basis: 100
    hidden_sizes: [512, 512, 512]
    omega_0: 30.0
  regularization: 0.001

forward_models:
  models: [b2b_nonlinear]
  function_encoder_artifact: siren2_nbasis100_omega10to30_ssim_3gpu
  hidden_sizes: [128, 128]
  coefficient_loss_weight: 1.0
  reconstruction_loss_weight: 1.0
  batch_size: 1
  gradient_accumulation_steps: 4
  sample_with_replacement: true
  epochs: 1
  max_steps: 5000
  eval_interval: 250
  eval_batches: 2
  log_interval: 10
  learning_rate: 0.0001
  checkpoint_interval: 250
