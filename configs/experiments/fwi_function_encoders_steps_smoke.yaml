experiment: fwi_function_encoders_steps_smoke
description: Tiny FWI smoke test for step-budget function encoder training.

dataset:
  name: fwi
  source: ajthor/fwi
  sample_limit: 8

runtime:
  dry_run: true
  launcher: torchrun
  nproc_per_node: 4
  device: cuda
  num_workers: 0
  pin_memory: true
  env:
    NCCL_SHM_DISABLE: "1"

matrix:
  seeds: [1]
  stages:
    - function_encoders

function_encoders:
  artifact: steps_smoke
  encoder_types: [input, output]
  basis_chunk_size: 2
  coefficient_grad: false
  basis:
    kind: siren
    n_basis: 4
    hidden_sizes: [16]
    omega_0: 30.0
  regularization: 0.001
  batch_size: 1
  epochs: 1
  max_steps: 4
  eval_interval: 2
  eval_batches: 2
  log_interval: 1
  learning_rate: 0.0001
  checkpoint_interval: 2
