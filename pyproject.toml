[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "b2b-operator-inverse"
version = "0.1.0"
description = "Inverse neural operator models and utilities."
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "torch",
    "matplotlib",
    "scipy"
]

[tool.setuptools.packages.find]
where = ["inverse_neural_operator"]
